services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:?set a reviewed pinned PostgreSQL tag}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
    restart: unless-stopped

  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:?set a reviewed pinned MinIO tag}
    command: server /data
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?required}
    volumes: [object_data:/data]
    networks: [private]
    restart: unless-stopped

  app:
    build: { context: ., dockerfile: Dockerfile }
    read_only: true
    tmpfs: [/tmp]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?required}
      AUDIT_SIGNING_KEY: ${AUDIT_SIGNING_KEY:?required}
      AUDIT_SIGNING_KEY_ID: ${AUDIT_SIGNING_KEY_ID:?required}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?required}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?required}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?required}
      MALWARE_SCANNER_URL: ${MALWARE_SCANNER_URL:?required}
      MALWARE_SCANNER_HEALTH_URL: ${MALWARE_SCANNER_HEALTH_URL:?required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_VERSION: ${OPENROUTER_MODEL_VERSION:-}
    ports: ["3000:3000", "4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    networks: [private, egress]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  postgres_data:
  object_data:
networks:
  private: { internal: true }
  egress: {}

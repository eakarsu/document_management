name: verify
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.3-alpine3.20
        env: { POSTGRES_USER: dms_test, POSTGRES_PASSWORD: test_only_password, POSTGRES_DB: dms_test }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U dms_test -d dms_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dms_test:test_only_password@127.0.0.1:5432/dms_test
      TEST_DATABASE_URL: postgresql://dms_test:test_only_password@127.0.0.1:5432/dms_test
      AUDIT_SIGNING_KEY_ID: ci-test-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.4.1, cache: npm }
      - name: Generate ephemeral test signing keys
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUDIT_SIGNING_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: node backend/node_modules/prisma/build/index.js generate --schema backend/prisma/schema.prisma
      - run: node backend/node_modules/prisma/build/index.js migrate deploy --schema backend/prisma/schema.prisma
      - run: npm run typecheck --workspace backend
      - run: npm test --workspace backend -- --runInBand
      - run: npm run typecheck --workspace frontend
      - run: npm run build --workspace frontend
      - run: docker build --tag "dms-ci:${GITHUB_SHA}" .
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
